<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trivial del Almacén</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --fondo1:#1b1446; --fondo2:#2c1a72; --panel:rgba(255,255,255,.08); --panel2:rgba(255,255,255,.14);
  --texto:#fff; --suave:rgba(255,255,255,.72);
  --rojo:#e8384f; --azul:#2d7ff9; --amarillo:#f5b700; --verde:#1fb45a;
  --rosa:#ff4fa3; --naranja:#ff8a1f; --morado:#8b5cf6; --cian:#14c4d6;
  --radio:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Fredoka',system-ui,sans-serif;color:var(--texto);
  background:radial-gradient(1200px 700px at 15% 0%,#4b2bb3 0%,transparent 60%),
             radial-gradient(900px 600px at 100% 100%,#c2187a55 0%,transparent 60%),
             linear-gradient(160deg,var(--fondo1),var(--fondo2));
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:0}
input{font-family:inherit}
.oculto{display:none!important}
#app{min-height:100vh}

/* ---------- elementos comunes ---------- */
.marca{display:flex;align-items:center;gap:14px}
.marca h1{font-size:clamp(28px,4vw,56px);font-weight:700;letter-spacing:.5px;line-height:1}
.marca small{display:block;font-size:clamp(14px,1.4vw,20px);color:var(--suave);font-weight:500;margin-top:4px}
.btn{
  background:#fff;color:#2a1a6e;font-weight:700;font-size:clamp(18px,1.8vw,26px);
  padding:16px 34px;border-radius:999px;box-shadow:0 6px 0 #00000040;transition:transform .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #00000040}
.btn.color{background:var(--amarillo);color:#2a1a6e}
.btn.secundario{background:var(--panel2);color:#fff;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:var(--radio);padding:24px}
.aviso{background:#ffcf3a;color:#2a1a6e;border-radius:14px;padding:10px 16px;font-weight:600;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-weight:600;
  font-size:clamp(16px,1.5vw,22px);color:#fff;animation:entra .35s ease-out}
.chip .x{background:#0003;color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:24px;text-align:center}
@keyframes entra{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}70%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ---------- PANTALLA (profesor) ---------- */
.pantalla{min-height:100vh;display:flex;flex-direction:column;padding:28px clamp(20px,3vw,48px);gap:24px}
.barra{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.barra .derecha{display:flex;gap:10px;align-items:center}
.etiqueta{background:var(--panel2);border-radius:999px;padding:8px 18px;font-weight:600;font-size:clamp(15px,1.4vw,20px)}
.centro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}

.inicio-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;width:100%;max-width:1200px;text-align:left}
.lista-niveles{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.fila-nivel{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:16px;padding:12px 16px;font-size:20px}
.fila-nivel .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.fila-nivel .n{color:var(--suave);margin-left:auto;font-size:16px;white-space:nowrap}
.campo{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.tema-abierto{margin-top:16px;border:2px solid var(--c);border-radius:18px;padding:12px;background:#ffffff0d;background:color-mix(in srgb,var(--c) 14%,transparent)}
.tema-cab{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700}
.tema-cab .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.tema-abierto .lista-niveles{margin-top:10px}
.fila-nivel.bloque{cursor:pointer;font-size:18px;padding:10px 14px}
.fila-nivel.bloque input{width:22px;height:22px;accent-color:#ffcf3a;flex:none}
.fila-nivel.bloque:has(input:not(:checked)){opacity:.5}
.temas-cerrados{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:16px}
.tema-cerrado{display:flex;align-items:center;gap:8px;background:#ffffff10;border:1px dashed #ffffff33;color:#ffffff70;border-radius:14px;padding:12px 14px;font-weight:600;font-size:17px;filter:grayscale(1)}
.tema-cerrado .candado{font-size:20px}
.campo label{color:var(--suave);font-size:16px}
.campo input{font-size:22px;padding:10px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:#0002;color:#fff;width:140px}

.lobby{display:grid;grid-template-columns:auto 1fr;gap:36px;width:100%;max-width:1400px;align-items:start}
.qr-caja{background:#fff;border-radius:28px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;color:#2a1a6e}
.qr-caja #qr{width:min(34vw,360px);height:min(34vw,360px)}
.qr-caja #qr img,.qr-caja #qr canvas{width:100%!important;height:100%!important}
.codigo{font-size:clamp(40px,5vw,72px);font-weight:700;letter-spacing:10px;line-height:1}
.url{font-size:14px;word-break:break-all;max-width:360px;text-align:center;color:#5b4ca8}
.jugadores{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;min-height:120px}
.contador{font-size:clamp(22px,2.4vw,34px);font-weight:600}

.intro-nivel .quesito-grande{width:min(36vh,300px);height:min(36vh,300px);animation:pop .7s ease-out}
.intro-nivel h2{font-size:clamp(36px,5vw,76px);line-height:1.05}
.intro-nivel p{font-size:clamp(20px,2vw,30px);color:var(--suave)}

.pregunta-txt{font-size:clamp(28px,3.6vw,58px);font-weight:600;line-height:1.15;max-width:1300px;
  background:#fff;color:#22155d;border-radius:28px;padding:28px 36px;box-shadow:0 10px 0 #0003}
.zona-tiempo{display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:wrap}
.reloj{position:relative;width:clamp(110px,11vw,160px);height:clamp(110px,11vw,160px)}
.reloj svg{width:100%;height:100%;transform:rotate(-90deg)}
.reloj .num{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(40px,4.4vw,64px);font-weight:700}
.reloj.urgente .num{color:#ffcf3a;animation:latido .5s infinite}
.respondidas{font-size:clamp(20px,2vw,30px);font-weight:600;background:var(--panel2);border-radius:20px;padding:14px 24px}
.respondidas b{font-size:1.5em}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;max-width:1400px}
.opcion{display:flex;align-items:center;gap:18px;border-radius:20px;padding:22px 26px;text-align:left;
  font-size:clamp(20px,2.3vw,36px);font-weight:600;color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 #0003;min-height:96px}
.opcion .forma{font-size:1.1em;flex:none;width:1.4em;text-align:center}
.opcion .barra-votos{position:absolute;left:0;bottom:0;height:8px;background:#fff9;transition:width .8s}
.opcion .votos{margin-left:auto;font-size:.85em;background:#0003;border-radius:12px;padding:4px 14px;flex:none}
.opcion.apagada{opacity:.3;filter:saturate(.4)}
.opcion.correcta{outline:6px solid #fff;animation:latido 1s 2}
.o0{background:var(--rojo)}.o1{background:var(--azul)}.o2{background:var(--amarillo)}.o3{background:var(--verde)}

.resultado-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;width:100%;max-width:1500px;align-items:start}
.resultado-grid .opciones{grid-template-columns:1fr}
.explicacion{display:flex;gap:12px;align-items:flex-start;background:#fff;color:#22155d;border-radius:18px;padding:14px 20px;
  font-size:clamp(17px,1.5vw,24px);line-height:1.3;text-align:left;font-weight:500;box-shadow:0 6px 0 #0003}
.explicacion span:first-child{font-size:1.3em;line-height:1}
.resultado-grid .opciones{gap:12px}
.centro:has(.explicacion){gap:16px}
.centro:has(.explicacion) .pregunta-txt{font-size:clamp(20px,2.1vw,34px)!important;padding:14px 24px!important}
.centro:has(.explicacion) .resultado-grid .opcion{min-height:54px;padding:9px 20px;font-size:clamp(16px,1.5vw,25px)}
.resultado-grid .opcion{min-height:70px;padding:16px 22px;font-size:clamp(18px,1.8vw,28px)}
.tabla-top h3{font-size:24px;margin-bottom:12px;text-align:left}
.fila-rank{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:clamp(17px,1.6vw,24px);text-align:left}
.fila-rank .pos{width:34px;font-weight:700;color:var(--suave)}
.fila-rank .punto{width:14px;height:14px;border-radius:50%;flex:none}
.fila-rank .nom{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila-rank .pts{font-weight:700}
.fila-rank .mas{color:#7dffb0;font-size:.8em;margin-left:6px}
.fila-rank.oro{background:linear-gradient(90deg,#f5b70055,var(--panel))}

.fin-nivel{width:100%;max-width:1300px;display:flex;flex-direction:column;gap:22px;align-items:center}
.ganadores{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.ganador{display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .7s ease-out both}
.ganador .q{width:120px;height:120px}
.ganador .nom{font-size:clamp(26px,3vw,44px);font-weight:700}
.ganador .pts{color:var(--suave);font-size:22px}
.rank-cols{columns:2 320px;column-gap:18px;width:100%}
.rank-cols .fila-rank{break-inside:avoid}

.tabla-final{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:clamp(16px,1.5vw,22px)}
.tabla-final th{color:var(--suave);font-weight:500;padding:4px 10px;text-align:center}
.tabla-final th:nth-child(2),.tabla-final td:nth-child(2){text-align:left}
.tabla-final td{background:var(--panel);padding:10px;text-align:center}
.tabla-final td:first-child{border-radius:14px 0 0 14px;font-weight:700}
.tabla-final td:last-child{border-radius:0 14px 14px 0}
.tabla-final td.q-celda svg{width:40px;height:40px;vertical-align:middle}
.tabla-final td.ganado{color:#fff;font-weight:700}
.scroll{max-height:52vh;overflow:auto;width:100%;padding-right:6px}

.podio{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin-top:10px}
.peldano{display:flex;flex-direction:column;align-items:center;gap:8px;animation:pop .8s ease-out both}
.peldano .q{width:clamp(70px,7vw,110px);height:clamp(70px,7vw,110px)}
.peldano .nom{font-size:clamp(20px,2.4vw,36px);font-weight:700;max-width:260px;text-align:center;overflow-wrap:anywhere}
.peldano .bloque{width:clamp(130px,14vw,220px);border-radius:18px 18px 0 0;display:grid;place-items:center;font-size:clamp(34px,4vw,60px);font-weight:700}
.peldano.p1 .bloque{height:130px;background:var(--amarillo);color:#2a1a6e}
.peldano.p2 .bloque{height:95px;background:#cfd6e6;color:#2a1a6e}
.peldano.p3 .bloque{height:65px;background:#e0975a;color:#2a1a6e}
.peldano .det{color:var(--suave);font-size:18px}

.avatar{display:inline-grid;place-items:center;border-radius:50%;border:3px solid;object-fit:cover;flex:none;color:#fff;font-weight:700;line-height:1;background:#0003}
.chip .avatar{margin-left:-10px}
.celda-jug{display:inline-flex;align-items:center;gap:10px}
.ganador .avatar,.peldano .avatar{box-shadow:0 6px 0 #0003}
.casilla{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:17px;color:var(--suave);cursor:pointer}
.casilla input{width:22px;height:22px;accent-color:#ffcf3a;flex:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;transition:.3s;background:#fff;color:#2a1a6e;
  font-weight:600;border-radius:16px;padding:14px 20px;max-width:min(92vw,720px);box-shadow:0 10px 30px #0006;z-index:99;pointer-events:none;text-align:center}
#toast.visible{opacity:1;transform:translate(-50%,0)}

.titulo-menu{font-size:clamp(28px,3vw,44px)}
.asignaturas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;width:100%;max-width:1200px}
.asig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px 18px;border-radius:24px;
  background:var(--c);color:#fff;box-shadow:0 8px 0 #0004;text-align:center;transition:transform .1s;min-height:220px}
.asig:hover{transform:translateY(-4px)}
.asig:active{transform:translateY(4px);box-shadow:0 4px 0 #0004}
.asig .icono{font-size:64px;line-height:1}
.asig .nom{font-size:clamp(22px,2vw,30px);font-weight:700;line-height:1.1}
.asig .det{font-size:16px;opacity:.92}
.asig.cerrada{background:#ffffff10;border:2px dashed #ffffff33;box-shadow:none;color:#ffffff80;filter:grayscale(1);cursor:not-allowed}
.asig.cerrada:hover{transform:none}
.cab-asig{display:flex;align-items:center;gap:18px;width:100%;max-width:1200px;flex-wrap:wrap}
.cab-asig h2{font-size:clamp(26px,3vw,40px)}
.cab-asig .btn{font-size:18px;padding:10px 22px}

/* ---------- MÓVIL (jugador) ---------- */
.movil{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:18px 16px calc(18px + env(safe-area-inset-bottom));gap:16px}
.movil .cabecera{display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:10px}
.movil .yo{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:999px;padding:6px 14px 6px 6px;font-size:16px;max-width:65%}
.movil .yo .punto{width:26px;height:26px;border-radius:50%;flex:none}
.movil .yo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.movil .cuerpo{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;text-align:center}
.movil h2{font-size:30px;line-height:1.1}
.movil p{color:var(--suave);font-size:18px}
.movil .entrada{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.movil .entrada input{font-size:24px;padding:16px;border-radius:16px;border:0;text-align:center;color:#22155d;font-weight:600;width:100%}
.movil .entrada .btn{width:100%}
.movil .zona-selfie{display:flex;flex-direction:column;align-items:center;gap:10px}
.movil .btn.selfie{font-size:18px;padding:14px 20px;width:100%;text-align:center}
.movil .btn.mini{font-size:15px;padding:8px 16px;width:auto}
.movil .botones.largas{grid-template-columns:1fr}
.movil .botones.largas .resp{flex-direction:row;justify-content:flex-start;text-align:left;font-size:16px;padding:10px 14px;gap:12px}
.movil .botones.largas .resp .forma{font-size:24px}
.movil .error{color:#ffcf3a;font-weight:600;min-height:24px}
.movil .botones{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:12px;width:100%}
.movil .botones.dos{grid-template-columns:1fr}
.movil .resp{border-radius:20px;color:#fff;font-size:19px;font-weight:600;padding:14px 10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 0 #0003;line-height:1.15;overflow-wrap:anywhere}
.movil .resp .forma{font-size:34px}
.movil .resp:active{transform:translateY(3px);box-shadow:0 3px 0 #0003}
.movil .barra-tiempo{height:12px;background:#ffffff26;border-radius:999px;overflow:hidden;width:100%}
.movil .barra-tiempo i{display:block;height:100%;background:#fff;border-radius:999px;width:100%}
.movil .preg-movil{background:#fff;color:#22155d;border-radius:18px;padding:14px 16px;font-size:18px;font-weight:600;text-align:left;line-height:1.25}
.movil .expl-movil{background:#0003;color:#fff;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.35;text-align:left;max-width:420px}
.movil .grande{font-size:84px;line-height:1;animation:pop .6s ease-out}
.movil .puntos{font-size:44px;font-weight:700}
.movil .quesito-movil{width:150px;height:150px;animation:pop .7s ease-out}
.movil.ok{background:linear-gradient(160deg,#0f8a45,#1fb45a)}
.movil.mal{background:linear-gradient(160deg,#9e1b32,#e8384f)}

@media (max-width:900px){
  .inicio-grid,.lobby,.resultado-grid{grid-template-columns:1fr}
  .qr-caja #qr{width:260px;height:260px}
  .opciones{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   1. CONFIGURACIÓN DE FIREBASE
   Pega aquí los datos de tu proyecto (Configuración del proyecto →
   Tus apps → Web). Mientras databaseURL esté vacío, el juego funciona
   en MODO PRUEBA: solo entre pestañas del mismo navegador.
   Reglas de Realtime Database (pestaña «Reglas»):
     { "rules": { "trivialAlmacen": { "salas": { "$sala": {
         ".read": true, ".write": true } } } } }
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD_ZvOsf7dZLeY7ls9cSh-xtQlcvsaKyrY",
  authDomain: "trivial-almacenaje.firebaseapp.com",
  databaseURL: "https://trivial-almacenaje-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "trivial-almacenaje",
  appId: "1:5282622826:web:c612f663b87fd3d8110913"
};

/* =====================================================================
   2. AJUSTES DEL JUEGO
   ID_JUEGO separa este Trivial de los demás que tengas en la misma
   cuenta de GitHub: da nombre a la carpeta de Firebase donde se guardan
   las salas y a los datos que el navegador recuerda. El de 1.º debe
   seguir siendo "trivialAlmacen" (es la ruta que permiten tus reglas).
   Para el Trivial de 2.º usa otro, por ejemplo "trivial2GB", y añade
   esa misma ruta a las reglas de Firebase.
   ===================================================================== */
const ID_JUEGO = "trivialAlmacen";
const AJUSTES = {
  titulo: "Trivial de 1.º",
  subtitulo: "Grado Básico de Servicios Comerciales",
  segundosPorPregunta: 20,     // se puede cambiar también en la pantalla de inicio
  segundosPuntuacionMaxima: 5, // si aciertan en estos segundos: puntuación máxima
  puntosMaximos: 100,
  puntosMinimos: 10,           // lo que vale un acierto en el último segundo
  permitirSelfies: true        // valor inicial de la casilla «Permitir selfies» en la pantalla de inicio
};

/* =====================================================================
   3. ASIGNATURAS, TEMAS, BLOQUES Y PREGUNTAS
   Cada asignatura tiene sus temas; cada tema, su color y uno o varios
   bloques; cada bloque es un nivel de la partida y reparte su quesito.
   Una asignatura aparece con candado mientras no tenga ningún tema
   abierto. Para abrir un tema: cambia su título, pon bloqueado: false
   y añade sus bloques. Cada pregunta puede llevar una "explicacion",
   que se muestra solo después de cerrarse la pregunta. "correcta" = posición de la respuesta buena empezando
   a contar en 0 (0 = primera, 1 = segunda, 2 = tercera, 3 = cuarta).
   ===================================================================== */
const ASIGNATURAS = [
  {
    id: "almacenaje", nombre: "Almacenaje", icono: "📦", color: "#2d7ff9",
    temas: [
  { titulo: "La logística en la empresa", color: "#2d7ff9", bloqueado: false, bloques: [
      { titulo: "La empresa", preguntas: [
          { texto: "¿Qué es una empresa?",
            opciones: ["Una organización que fabrica productos y siempre busca obtener beneficio económico", "Una organización en la que una o varias personas desarrollan actividades relacionadas con los factores de producción", "Un establecimiento que compra productos a sus proveedores para venderlos a sus clientes", "Un conjunto de departamentos que ofrecen únicamente bienes intangibles"], correcta: 1 },
          { texto: "¿Cuál es la finalidad de una empresa?",

            opciones: ["A los compradores que entran cada día en la tienda y a su forma de comprar.", "A quienes recomiendan los productos de la empresa sin llegar a venderlos.", "A los clientes de los comercios competidores y a sus preferencias.", "Al personal de la empresa y su influencia en la atención y el servicio."], correcta: 3,
            explicacion: "Esta variable destaca la importancia del trabajo del personal para prestar un servicio de calidad." },
          { texto: "Una peluquería organiza paso a paso cómo se atiende a cada cliente, desde que pide cita hasta que paga. ¿Qué variable trabaja principalmente?",
            opciones: ["Distribución.", "Comunicación.", "Procesos.", "Producto."], correcta: 2,
            explicacion: "«Procesos» se refiere a la planificación de las operaciones internas que permiten entregar bienes o prestar servicios." },
          { texto: "¿Qué relación existe entre marketing y merchandising?",
            opciones: ["El merchandising forma parte del marketing y se centra en el punto de venta.", "El marketing forma parte del merchandising y se centra en la publicidad.", "Son dos nombres diferentes para referirse a la misma actividad.", "El marketing se aplica a servicios y el merchandising a productos físicos."], correcta: 0,
            explicacion: "El marketing es más amplio. El merchandising trabaja sobre el punto de venta para favorecer las ventas y su rentabilidad." },
          { texto: "¿Dónde pueden aplicarse técnicas de merchandising?",
            opciones: ["Solo en tiendas físicas que funcionan en autoservicio.", "Solo en establecimientos que venden productos físicos.", "Solo en comercios con escaparates que dan a la calle.", "En espacios de venta físicos y virtuales."], correcta: 3,
            explicacion: "El merchandising puede aplicarse tanto al comercio físico como al comercio electrónico." },
          { texto: "¿Cuál de estas actuaciones es un ejemplo de presentación visual?",
            opciones: ["Comprobar cuántas unidades de cada producto quedan en el almacén.", "Organizar los turnos del personal de caja para los fines de semana.", "Crear una exposición atractiva con productos y colores coordinados.", "Registrar en el ordenador cuántos pedidos se han entregado hoy."], correcta: 2,
            explicacion: "La presentación visual busca mostrar los productos de manera atractiva para captar la atención y favorecer la compra." },
          { texto: "¿Para qué sirve la gestión de inventario?",
            opciones: ["Para decidir qué música se escucha en cada sección.", "Para mantener los productos disponibles en la cantidad y el momento adecuados.", "Para elegir los colores de los carteles promocionales.", "Para cambiar cada cierto tiempo la posición de los productos y sorprender al cliente."], correcta: 1,
            explicacion: "Gestionar el inventario implica controlar las existencias y organizar la reposición." },
          { texto: "Según los apuntes, ¿en qué consiste la práctica de rotación de productos?",
            opciones: ["En revisar cada mañana las cantidades disponibles de cada artículo.", "En agrupar en la misma estantería todos los productos que tienen el mismo precio.", "En sustituir los artículos vendidos por nuevas unidades traídas del almacén.", "En cambiar regularmente su disposición para destacar distintos artículos."], correcta: 3,
            explicacion: "En esta unidad, la rotación se presenta como el cambio de disposición para mantener el interés y destacar productos en diferentes momentos." },
          { texto: "¿Qué función tiene la señalización en una tienda?",
            opciones: ["Registrar las entradas y salidas de mercancía mediante etiquetas y códigos de barras.", "Informar y destacar precios, ofertas o características mediante elementos como carteles.", "Determinar la cantidad de productos que debe comprar la tienda a sus proveedores cada mes.", "Establecer los pasos internos que sigue el personal para preparar los pedidos."], correcta: 1,
            explicacion: "La señalización utiliza letreros, carteles, etiquetas y otros elementos para destacar características de los productos, como precios, ofertas especiales o características distintivas." },
          { texto: "¿Qué busca el marketing sensorial?",
            opciones: ["Organizar las secciones de la tienda según el precio de los productos que se venden.", "Reducir el número de veces que hay que reponer los productos de la tienda.", "Estimular los sentidos para influir en la experiencia y crear una conexión emocional.", "Explicar con carteles todas las características técnicas de cada producto a la venta."], correcta: 2,
            explicacion: "El marketing sensorial utiliza la vista, el oído, el olfato, el gusto y el tacto." },
          { texto: "Una tienda ofrece una pequeña muestra de queso para probarla. ¿Qué sentido estimula principalmente?",
            opciones: ["Gusto.", "Olfato.", "Tacto.", "Vista."], correcta: 0,
            explicacion: "La degustación permite experimentar el sabor del producto antes de comprarlo." },
          { texto: "¿Qué es la superficie de ventas?",
            opciones: ["El espacio donde se guarda la mercancía pendiente de reponer.", "La suma de las oficinas, los vestuarios y los almacenes del establecimiento.", "El espacio dedicado a mostrar y vender productos o prestar servicios.", "La parte del establecimiento ocupada por las cajas de cobro."], correcta: 2,
            explicacion: "Es el espacio destinado a la exposición y venta o a la prestación de servicios; puede estar cubierto o descubierto." },
          { texto: "¿Qué es una sección en un establecimiento de autoservicio?",
            opciones: ["Un espacio donde se agrupan productos de naturaleza similar.", "Un espacio donde se colocan artículos que tienen el mismo precio.", "Una zona que contiene los productos que están de oferta.", "Una zona reservada a los artículos recién llegados."], correcta: 0,
            explicacion: "Las secciones agrupan productos similares para facilitar que el cliente los encuentre y compre." },
          { texto: "¿Qué caracteriza a una zona caliente?",
            opciones: ["Tiene una iluminación de tonos cálidos.", "Recibe un tráfico elevado de clientes.", "Contiene los productos de mayor precio.", "Se utiliza para presentar productos de verano."], correcta: 1,
            explicacion: "Una zona caliente recibe muchas personas y tiene mayores oportunidades de venta." },
          { texto: "¿Qué significa «calentar» una zona fría?",
            opciones: ["Cambiar los productos económicos por otros más caros.", "Aumentar el número de artículos almacenados en esa zona.", "Colocar los productos según sus colores.", "Conseguir que atraiga más atención y visitas de clientes."], correcta: 3,
            explicacion: "Calentar un punto frío consiste en hacerlo más atractivo y fomentar que los clientes lo recorran o se detengan en él." }
        ] },
        { titulo: "Nivel intermedio", preguntas: [
          { texto: "Una agencia de viajes coloca imágenes de destinos y presenta sus paquetes de forma atractiva en el local. ¿Puede considerarse merchandising?",
            opciones: ["No, porque los viajes son servicios y no se colocan en estanterías.", "Sí, pero únicamente si también vende maletas y otros objetos.", "Sí, porque el merchandising también puede ayudar a vender servicios.", "No, porque las imágenes pertenecen siempre a la publicidad exterior."], correcta: 2,
            explicacion: "El merchandising moderno también hace más visibles y atractivos los servicios en el punto de venta." },
          { texto: "Una tienda coloca las fundas de móvil junto a los teléfonos. ¿Qué pretende principalmente?",
            opciones: ["Favorecer compras adicionales mediante productos complementarios.", "Agrupar artículos que tienen aproximadamente el mismo precio.", "Separar los productos principales de sus accesorios.", "Reservar esa sección para compras de última hora."], correcta: 0,
            explicacion: "Acercar productos que se utilizan juntos facilita que el cliente considere comprar ambos." },
          { texto: "Se forman atascos porque dos expositores estrechan un pasillo. ¿Qué medida responde mejor al problema?",
            opciones: ["Colocar más ofertas en ese pasillo para que los clientes se detengan.", "Aumentar el volumen de la música ambiental para animar a circular.", "Añadir un cartel que informe de los productos de los expositores.", "Reubicar los expositores para dejar una ruta más amplia y clara."], correcta: 3,
            explicacion: "La circulación mejora con pasillos amplios, rutas claras y menos obstáculos." },
          { texto: "Una tienda crea una exposición llamativa para que los clientes se fijen en una nueva colección. ¿Qué está creando?",
            opciones: ["Un registro de inventario.", "Un punto focal visual.", "Un canal de distribución.", "Un punto de decisión entre zonas."], correcta: 1,
            explicacion: "Un punto focal es una exposición o elemento visual que concentra la atención del cliente." },
          { texto: "Una estantería dificulta que los clientes vean los artículos expuestos. ¿Qué debería revisarse primero?",
            opciones: ["La duración de la promoción.", "El estilo de música de la tienda.", "La altura y la visibilidad de la exposición.", "La cantidad de productos registrados en el inventario."], correcta: 2,
            explicacion: "La altura de estanterías y exposiciones debe permitir que los productos se vean con facilidad." },
          { texto: "Una tienda prepara un espacio para toallas de playa en verano y lo transforma para vender turrones en Navidad. ¿Qué está teniendo en cuenta?",
            opciones: ["El anclaje de precios.", "La compra de último minuto.", "La personalización del servicio.", "La estacionalidad."], correcta: 3,
            explicacion: "La estacionalidad implica que la demanda cambia en determinadas épocas del año." },
          { texto: "¿Qué permite que una zona de promociones sea flexible?",
            opciones: ["Modificar su distribución cuando cambian las campañas o las temporadas.", "Mantener siempre los mismos productos destacados en esa zona durante todo el año.", "Utilizarla como almacén cuando hay mucha mercancía.", "Colocar en ella cualquier artículo sin seguir un criterio."], correcta: 0,
            explicacion: "Una distribución flexible facilita adaptar el espacio a nuevas promociones y productos estacionales." },
          { texto: "Hay unidades de un producto en el almacén, pero su estantería lleva horas vacía. ¿Qué necesita mejorar principalmente?",
            opciones: ["El diseño del envase del producto.", "La reposición de productos.", "La música ambiental.", "La variedad de precios."], correcta: 1,
            explicacion: "Tener mercancía almacenada no basta: debe reponerse para que esté disponible en la superficie de ventas." },
          { texto: "¿Qué diferencia hay entre inventario y gestión de inventario?",
            opciones: ["El inventario cuenta los clientes que entran y la gestión cuenta los productos que salen.", "El inventario recoge las ventas del día y la gestión diseña las promociones de la semana.", "El inventario organiza las secciones de la tienda y la gestión decide cómo se iluminan.", "El inventario registra las existencias y la gestión supervisa y controla su disponibilidad."], correcta: 3,
            explicacion: "El inventario es el registro de productos disponibles; su gestión incluye el seguimiento y control de esas existencias." },
          { texto: "Una tienda instala asientos cómodos para que los acompañantes puedan descansar. ¿Qué aspecto mejora directamente?",
            opciones: ["La distribución de mercancía entre proveedores.", "El control de existencias del almacén.", "La experiencia del cliente durante la visita.", "La clasificación de los artículos por categorías."], correcta: 2,
            explicacion: "Las áreas de descanso pueden hacer la visita más cómoda y favorecer estancias más largas." },
          { texto: "Según los apuntes, ¿qué inicia el proceso de compra?",
            opciones: ["Reconocer una necesidad o un interés por un producto.", "Comparar los precios de varias tiendas.", "Elegir el método de pago.", "Valorar el resultado después de usar el producto."], correcta: 0,
            explicacion: "El proceso parte del reconocimiento de una necesidad y llega hasta la evaluación de la compra." },
          { texto: "¿Por qué algunos supermercados colocan productos básicos al fondo?",
            opciones: ["Para que esos productos sean menos visibles y se vendan menos.", "Para que el cliente pase por otros artículos antes de llegar a ellos.", "Para evitar que el cliente compre productos que no llevaba previstos.", "Para convertir todo el fondo en una zona de almacenamiento."], correcta: 1,
            explicacion: "El recorrido hasta los productos básicos permite que el cliente vea otros artículos y pueda añadirlos a su compra." },
          { texto: "¿Qué es el punto de decisión descrito en la unidad?",
            opciones: ["El lugar donde el cliente decide cómo va a pagar.", "El lugar donde el personal comprueba las existencias.", "El lugar de transición entre una zona fría y una caliente.", "El lugar donde el cliente prueba un producto."], correcta: 2,
            explicacion: "En esa transición pueden colocarse ofertas o productos destacados para influir en el recorrido y la compra." },
          { texto: "¿Qué situación puede contribuir a que un pasillo sea una zona fría?",
            opciones: ["Una columna tapa parte del acceso y la iluminación es escasa.", "El pasillo es amplio y conecta dos secciones muy visitadas.", "Los productos son visibles y hay señales claras.", "La zona recibe un flujo continuo de clientes."], correcta: 0,
            explicacion: "Las barreras, la mala disposición del mobiliario y la falta de iluminación pueden reducir las visitas." },
          { texto: "¿Cuál es un método físico para atraer clientes a una zona fría?",
            opciones: ["Crear una oferta que solo sea válida durante unas horas de la tarde.", "Utilizar precios terminados en 9 en todos los productos de la zona.", "Recomendar productos a cada cliente según sus gustos y sus compras anteriores.", "Mejorar la iluminación y recolocar un expositor que tapa los artículos."], correcta: 3,
            explicacion: "Los métodos físicos actúan sobre la disposición, la presentación visual y la organización del espacio." },
          { texto: "Una tienda anuncia una oferta real que termina esa misma tarde. ¿Qué recurso psicológico utiliza principalmente?",
            opciones: ["Anclaje de precios.", "Sensación de urgencia.", "Zonificación por categorías.", "Presentación visual."], correcta: 1,
            explicacion: "Limitar el tiempo disponible puede hacer que el cliente quiera aprovechar la oferta antes de que termine." },
          { texto: "Una tienda coloca una mochila de 35 € junto a otra de 95 € para que la primera parezca más económica. ¿Qué técnica utiliza?",
            opciones: ["Reposición de productos.", "Rotación de productos.", "Anclaje de precios.", "Gestión de inventario."], correcta: 2,
            explicacion: "El anclaje modifica la percepción del precio mediante la comparación con otro producto más caro." },
          { texto: "¿Qué criterio debería guiar la elección de la música ambiental?",
            opciones: ["Que coincida con las preferencias personales del encargado.", "Que sea la misma que utiliza el comercio más cercano.", "Que tenga un ritmo rápido en cualquier tipo de tienda.", "Que encaje con el público objetivo y la imagen de la marca."], correcta: 3,
            explicacion: "La música debe contribuir a una atmósfera adecuada para los clientes y el estilo del comercio." },
          { texto: "¿Por qué suelen colocarse chicles y otros pequeños artículos junto a las cajas?",
            opciones: ["Para favorecer compras adicionales mientras el cliente espera.", "Para que sustituyan a los productos básicos de otras secciones.", "Para reducir la necesidad de llevar un inventario.", "Para evitar que el cliente vea ofertas antes de pagar."], correcta: 0,
            explicacion: "La zona de cajas ofrece una última oportunidad para que el cliente añada artículos a su compra." },
          { texto: "Una tienda usa un aroma característico que los clientes reconocen en sus visitas. ¿Qué busca principalmente?",
            opciones: ["Que los clientes identifiquen el precio de los productos.", "Que asocien ese olor agradable con la tienda o la marca.", "Que encuentren la caja sin necesidad de señales.", "Que distingan qué productos tienen descuento."], correcta: 1,
            explicacion: "El olfato puede contribuir a crear una asociación emocional entre un aroma y una marca." }
        ] },
        { titulo: "Nivel moderado/difícil", preguntas: [
          { texto: "Una zona apenas recibe visitas porque un mueble tapa su entrada. Ya hay un cartel visible que anuncia un descuento. ¿Qué actuación aborda mejor la causa del problema?",
            opciones: ["Aumentar el descuento del cartel y mantener el mueble donde está.", "Añadir una fecha límite a la oferta para crear sensación de urgencia.", "Colocar más productos junto al mueble para que la zona parezca llena.", "Mover el mueble para facilitar el acceso y la visibilidad."], correcta: 3,
            explicacion: "Si el problema principal es una barrera física, conviene corregirla para que la promoción pueda atraer visitas a una zona accesible." },
          { texto: "Una tienda quiere mejorar un rincón oscuro y poco visitado. ¿Qué propuesta combina un método físico y otro psicológico?",
            opciones: ["Mejorar la iluminación del rincón y colocar los productos a una altura visible.", "Mejorar la iluminación y ofrecer allí un descuento durante un plazo limitado.", "Aplicar un descuento y utilizar precios terminados en 9.", "Ampliar el acceso y retirar un expositor que dificulta el paso."], correcta: 1,
            explicacion: "La iluminación es un método físico; el descuento con duración limitada actúa sobre la percepción de ahorro y la urgencia." },
          { texto: "Una mesa promocional llama mucho la atención, pero bloquea el acceso a una sección. ¿Cuál es la mejor decisión?",
            opciones: ["Reubicarla para mantener su visibilidad y dejar libre el paso.", "Mantenerla porque captar la atención es lo más importante.", "Ampliarla para que más productos aprovechen su ubicación.", "Añadir una señal que indique que se debe rodear la mesa."], correcta: 0,
            explicacion: "Una buena presentación debe atraer sin perjudicar la circulación ni el acceso a los productos." },
          { texto: "Una tienda coloca productos básicos al fondo para ampliar el recorrido. ¿Qué medida permite compatibilizar esa estrategia con una buena experiencia de compra?",
            opciones: ["Cambiar esos productos de sitio cada día.", "Reducir los carteles para que el cliente explore más pasillos de la tienda.", "Mantener pasillos claros y señalización que facilite encontrarlos.", "Estrechar los accesos para que el cliente se detenga."], correcta: 2,
            explicacion: "Ampliar el recorrido puede favorecer ventas adicionales, pero el cliente necesita orientarse y encontrar lo que busca." },
          { texto: "Una tienda cambia cada semana los artículos que aparecen en su mesa principal. También comprueba sus existencias y repone los que se venden. ¿Qué prácticas está combinando?",
            opciones: ["Señalización de precios y marketing olfativo.", "Rotación de productos y gestión de inventario.", "Anclaje de precios y zonificación por categorías.", "Estacionalidad y personalización del servicio."], correcta: 1,
            explicacion: "Cambiar los artículos destacados corresponde a la rotación; controlar y reponer existencias corresponde a la gestión de inventario." },
          { texto: "Una agencia de viajes quiere mejorar la venta de sus servicios dentro del local. ¿Qué propuesta encaja mejor con el merchandising?",
            opciones: ["Cambiar la empresa externa que lleva la contabilidad de la agencia.", "Organizar por fecha los documentos internos y los contratos firmados.", "Revisar las condiciones de contratación y los horarios de su personal.", "Presentar destinos y paquetes de forma visible para facilitar su elección."], correcta: 3,
            explicacion: "El merchandising de servicios ayuda al cliente a comprender y valorar la oferta en el punto de venta." },
          { texto: "Al acercarse Navidad, una tienda quiere destacar productos de temporada sin dificultar la circulación. ¿Qué plan es más adecuado?",
            opciones: ["Repartirlos por los pasillos, aunque estrechen algunos accesos.", "Sustituir la señalización de las secciones por carteles navideños.", "Preparar una zona temporal adaptable y mantener los recorridos despejados.", "Colocarlos en los huecos disponibles sin modificar la distribución."], correcta: 2,
            explicacion: "La planificación estacional necesita espacio propio y flexibilidad, respetando la circulación por el establecimiento." },
          { texto: "Una tienda baja mucho los precios. Vende más unidades, pero obtiene menos beneficio con el espacio utilizado. ¿Qué conclusión encaja mejor con el objetivo del merchandising?",
            opciones: ["Vender más unidades no garantiza mejorar la rentabilidad del espacio.", "La promoción ha cumplido su objetivo final porque han aumentado las unidades vendidas.", "La rentabilidad del espacio depende del número de clientes, no de las ventas.", "El merchandising solo permite valorar si la exposición resulta atractiva."], correcta: 0,
            explicacion: "El objetivo final es mejorar la rentabilidad del espacio de venta, no simplemente aumentar la cantidad de artículos vendidos." },
          { texto: "Una empresa mejora el diseño de una botella y, después, decide cómo destacarla en una estantería. ¿Qué diferencia hay entre ambas decisiones?",
            opciones: ["Ambas corresponden únicamente a la distribución, porque afectan a cómo llega al cliente.", "La primera es merchandising y la segunda es diseño del producto en la fábrica.", "Ambas corresponden únicamente a la comunicación publicitaria de la marca.", "La primera trabaja el producto y la segunda su presentación en el punto de venta."], correcta: 3,
            explicacion: "Diseñar el producto pertenece a la variable «Producto»; decidir cómo exhibirlo es una actuación de merchandising." },
          { texto: "Dos tiendas venden ropa, pero se dirigen a públicos diferentes. ¿Cómo deberían elegir su música y su presentación?",
            opciones: ["Copiando la misma ambientación para poder comparar las ventas.", "Adaptándolas al público, a la imagen de marca y a los objetivos de cada tienda.", "Eligiendo en ambas lo que resulte más llamativo, sin considerar el público.", "Utilizando la música de moda y los mismos colores en las dos."], correcta: 1,
            explicacion: "Las técnicas de merchandising deben adaptarse a las características de cada comercio y sus clientes." },
          { texto: "Una tienda anuncia «Solo hoy» y otra «Últimas cinco unidades», y ambas informaciones son ciertas. ¿Qué diferencia principal existe entre los mensajes?",
            opciones: ["El primero destaca la calidad y el segundo la facilidad de compra.", "El primero se basa en anclaje de precios y el segundo en personalización.", "El primero limita el tiempo y el segundo destaca la cantidad disponible.", "El primero utiliza un método físico y el segundo organiza el inventario."], correcta: 2,
            explicacion: "La urgencia puede surgir por un plazo breve; la escasez, por una cantidad limitada." },
          { texto: "Una tienda quiere aplicar anclaje de precios, no una rebaja. ¿Qué actuación corresponde a esa intención?",
            opciones: ["Mostrar un producto de 40 € junto a otro de 110 € para favorecer la comparación.", "Bajar de 40 € a 32 € el precio del producto durante toda la semana.", "Ofrecer tres unidades por el precio de dos en todos los productos de la sección.", "Devolver al cliente una parte del importe en forma de vale para la siguiente compra."], correcta: 0,
            explicacion: "El anclaje utiliza un precio de referencia para cambiar la percepción del valor, sin exigir que se reduzca el precio." },
          { texto: "Tras mejorar una zona fría, la tienda quiere saber si ha conseguido «calentarla». ¿Qué dato responde de forma más directa a esa pregunta?",
            opciones: ["El número de productos de esa zona que aparecen registrados en el inventario general.", "El número de clientes que pasan y se detienen en esa zona antes y después.", "El número de carteles que se han colocado en toda la tienda.", "El número de trabajadores que prepararon la nueva exposición."], correcta: 1,
            explicacion: "Calentar la zona busca atraer atención y circulación. Comparar visitas y paradas permite comprobar ese cambio." },
          { texto: "Una tienda ofrece una degustación excelente, pero los clientes no encuentran el producto para comprarlo. ¿Qué mejora completaría mejor la acción?",
            opciones: ["Cambiar el sabor de la muestra por otro que guste a más clientes.", "Utilizar un aroma más intenso en la entrada para atraer a más gente.", "Aumentar el volumen de la música durante la degustación para animarla.", "Situar el producto de forma visible, señalizarlo y asegurar su reposición."], correcta: 3,
            explicacion: "El estímulo sensorial debe acompañarse de una presentación clara y de disponibilidad para facilitar la compra." },
          { texto: "Hay una cola larga en caja y un expositor de compras de último minuto estrecha el paso. ¿Qué decisión equilibra mejor ventas y comodidad?",
            opciones: ["Reorganizar el expositor para que siga visible sin dificultar la cola.", "Aumentar el tamaño del expositor para aprovechar la espera.", "Reducir la zona de espera para añadir más productos.", "Mantener la distribución actual y añadir descuentos a los artículos del expositor."], correcta: 0,
            explicacion: "La zona de cajas puede generar compras adicionales, pero también debe ofrecer una experiencia de pago cómoda." },
          { texto: "Una tienda en línea quiere aplicar merchandising digital. ¿Qué actuación encaja mejor?",

const COLORES_JUG = ["#e8384f","#2d7ff9","#f5b700","#1fb45a","#ff4fa3","#ff8a1f","#8b5cf6","#14c4d6","#ef6c8f","#5ab0ff","#9adf4a","#c77dff"];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
let COLORES_ACTIVOS = null;   // colores de los niveles de la partida (el móvil los recibe de la pantalla)
const colorNivel = i => (COLORES_ACTIVOS && COLORES_ACTIVOS[i]) || COLORES_NIVEL[i % COLORES_NIVEL.length];
function tono(hex, f) {        // f > 0 aclara, f < 0 oscurece
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255];
  const m = c.map(v => Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f)));
  return "#" + m.map(v => v.toString(16).padStart(2, "0")).join("");
}
function colorBloque(ti, bi) {
  const B = TEMAS[ti].bloques.length;
  return B <= 1 ? TEMAS[ti].color : tono(TEMAS[ti].color, -0.3 + 0.6 * bi / (B - 1));
}
const logoSVG = () => quesitoSVG(COLORES_NIVEL.length, COLORES_NIVEL.map((_, i) => i), -1, COLORES_NIVEL);
function bloquesDe(ai) {

function quesitoSVG(total, ganados = [], resaltar = -1, colores = null) {
  const col = i => (colores ? colores[i] : colorNivel(i));
  // Círculo dividido en tantas porciones como niveles; las ganadas, en color.
  const r = 46, c = 50, partes = [];
  if (total === 1) {
    const c0 = ganados.includes(0) ? col(0) : "rgba(255,255,255,.08)";
    partes.push(`<circle cx="50" cy="50" r="${r}" fill="${c0}" stroke="#fff" stroke-width="3"/>`);
  } else {
    for (let i = 0; i < total; i++) {
      const a0 = (i / total) * 2 * Math.PI - Math.PI / 2, a1 = ((i + 1) / total) * 2 * Math.PI - Math.PI / 2;
      const x0 = c + r * Math.cos(a0), y0 = c + r * Math.sin(a0), x1 = c + r * Math.cos(a1), y1 = c + r * Math.sin(a1);
      const grande = (a1 - a0) > Math.PI ? 1 : 0;
      const relleno = ganados.includes(i) || i === resaltar ? col(i) : "rgba(255,255,255,.08)";
      partes.push(`<path d="M${c},${c} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${grande} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${relleno}" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>`);
    }
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${partes.join("")}<circle cx="50" cy="50" r="${r}" fill="none" stroke="#fff" stroke-width="4"/></svg>`;
}

/* ---------------------------------------------------------------------
   CONEXIÓN: Firebase Realtime Database o modo prueba (localStorage)
   --------------------------------------------------------------------- */
const T = (() => {
  let modo = "prueba", db = null, offset = 0, errorMsg = "";
  const LS = `${ID_JUEGO}_prueba`;
  const oyentes = [];
  const leer = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } };
  const ruta = (o, p) => p.split("/").reduce((a, k) => (a == null ? undefined : a[k]), o);
  function poner(o, p, v) {
    const ks = p.split("/"); let a = o;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof a[ks[i]] !== "object" || a[ks[i]] === null) a[ks[i]] = {}; a = a[ks[i]]; }
    if (v === null || v === undefined) delete a[ks[ks.length - 1]]; else a[ks[ks.length - 1]] = v;
  }
  function avisar() {
    const o = leer();
    oyentes.forEach(l => {
      let v = ruta(o, l.p); if (v === undefined) v = null;
      const s = JSON.stringify(v);
      if (s !== l.ultimo) { l.ultimo = s; l.cb(v === null ? null : JSON.parse(s)); }
    });
  }
  window.addEventListener("storage", e => { if (e.key === LS) avisar(); });
  const cargar = src => new Promise((ok, mal) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => mal(new Error("network: no se pudo cargar " + src)); document.head.appendChild(s); });

  return {
    async iniciar() {
      if (FIREBASE_CONFIG.databaseURL && !params.has("prueba")) {
        try {
          await cargar("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
          await cargar("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js");
          await cargar("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js");
          firebase.initializeApp(FIREBASE_CONFIG);
          await firebase.auth().signInAnonymously();
          db = firebase.database();
          db.ref(".info/serverTimeOffset").on("value", s => { offset = s.val() || 0; });
          modo = "firebase";
        } catch (e) { console.error(e); modo = "error"; errorMsg = (e && (e.code || e.message)) || "error desconocido"; }
      }
      return modo;
    },
    modo: () => modo,
    error: () => errorMsg,
    ahora: () => Date.now() + offset,
    sello: () => (modo === "firebase" ? firebase.database.ServerValue.TIMESTAMP : Date.now()),
    set(p, v) {
      if (modo === "firebase") return db.ref(p).set(v);
      const o = leer(); poner(o, p, v); localStorage.setItem(LS, JSON.stringify(o)); avisar(); return Promise.resolve();
    },
    async get(p) {
      if (modo === "firebase") return (await db.ref(p).once("value")).val();
      const v = ruta(leer(), p); return v === undefined ? null : v;
    },
    on(p, cb) {
      if (modo === "firebase") { const r = db.ref(p); const h = s => cb(s.val()); r.on("value", h); return () => r.off("value", h); }
      const l = { p, cb, ultimo: undefined }; oyentes.push(l); setTimeout(avisar, 0);
      return () => { const i = oyentes.indexOf(l); if (i >= 0) oyentes.splice(i, 1); };
    },
    limpiarPrueba() { if (modo !== "firebase") { localStorage.removeItem(LS); } }
  };
})();

function calcularPuntos(segundos, duracion) {
  const a = AJUSTES.segundosPuntuacionMaxima, M = AJUSTES.puntosMaximos, m = AJUSTES.puntosMinimos;
  if (segundos <= a) return M;
  const f = Math.min(1, (segundos - a) / Math.max(1, duracion - a));
  return Math.round(M - (M - m) * f);
}

function explicarError(codigo) {
  const c = String(codigo || "");
  if (/operation-not-allowed|admin-restricted/.test(c)) return "Firebase no permite el acceso anónimo: actívalo en Authentication → Método de acceso → Anónimo.";
  if (/network|failed|load/i.test(c)) return "No se ha podido conectar con Firebase. Comprueba la conexión a internet.";
  if (/api-key|invalid-api|unauthorized-domain|referer/i.test(c)) return "Firebase ha rechazado esta dirección. Revisa la clave de la web y los dominios autorizados en Authentication → Configuración.";
  if (/PERMISSION_DENIED|permission/i.test(c)) return "Firebase ha rechazado la operación (permiso denegado). Revisa las reglas de la base de datos.";
  return "No se ha podido conectar con Firebase (" + c + ").";
}
// Cualquier escritura rechazada (reglas, conexión…) se muestra en pantalla en vez de fallar en silencio.
function aviso(texto) {

  if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = texto; t.classList.add("visible");
  clearTimeout(aviso.temp); aviso.temp = setTimeout(() => t.classList.remove("visible"), 7000);
}
window.addEventListener("unhandledrejection", ev => {
  const r = ev.reason || {}; aviso(explicarError(r.code || r.message || String(r)));
});
